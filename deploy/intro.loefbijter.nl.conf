# Host Apache vhost for intro.loefbijter.nl — thin reverse proxy only.
#
# Requires mod_proxy, mod_proxy_http, mod_headers enabled:
#   sudo a2enmod proxy proxy_http headers ssl
#
# Reuses the existing Let's Encrypt certificate already configured for the
# main loefbijter.nl Apache install — adjust the SSLCertificateFile /
# SSLCertificateKeyFile paths below to match that install (they're typically
# /etc/letsencrypt/live/<domain>/... if certbot manages a SAN cert covering
# this subdomain, or a separate certbot run for intro.loefbijter.nl).
#
# Install: copy this file to /etc/apache2/sites-available/, then:
#   sudo a2ensite intro.loefbijter.nl.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName intro.loefbijter.nl
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName intro.loefbijter.nl

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/intro.loefbijter.nl/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/intro.loefbijter.nl/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Apache adds X-Forwarded-For automatically via mod_proxy_http.

    ProxyPass        /  http://127.0.0.1:8080/
    ProxyPassReverse /  http://127.0.0.1:8080/

    ErrorLog  ${APACHE_LOG_DIR}/intro.loefbijter.nl-error.log
    CustomLog ${APACHE_LOG_DIR}/intro.loefbijter.nl-access.log combined
</VirtualHost>
