# Host Apache vhost for intro.loefbijter.nl.
#
# Real request chain (the site sits behind Cloudflare):
#     Cloudflare → Apache (:443) → nginx (127.0.0.1:8080) → gunicorn (backend:8000)
# Cloudflare terminates TLS for the visitor and re-encrypts to this origin
# (SSL mode "Full (strict)"), so the origin must serve a valid Let's Encrypt
# cert at all times. See deploy/deploy.md for cert issuance (webroot) and the
# renewal deploy hook.
#
# Required modules:
#   sudo a2enmod proxy proxy_http headers ssl rewrite remoteip
#
# Install:
#   sudo cp deploy/intro.loefbijter.nl.conf /etc/apache2/sites-available/
#   sudo a2ensite intro.loefbijter.nl.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName intro.loefbijter.nl

    # Permanent ACME webroot so `certbot renew` keeps working without ever
    # touching this vhost (certbot certonly --webroot -w /var/www/html).
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    # Everything else redirects to HTTPS, except the ACME path above.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName intro.loefbijter.nl

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/intro.loefbijter.nl/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/intro.loefbijter.nl/privkey.pem

    # --- Real client IP (mod_remoteip) ---------------------------------------
    # Cloudflare puts the true visitor IP in CF-Connecting-IP. Trust that header
    # ONLY when the connection comes from a published Cloudflare range; a direct
    # hit to the origin (not from Cloudflare) is not trusted and cannot forge it.
    # With this, Apache's client IP — and the X-Forwarded-For entry mod_proxy_http
    # appends downstream — is the real visitor, which is what rate limiting keys on.
    # Refresh the ranges from https://www.cloudflare.com/ips-v4 and /ips-v6.
    RemoteIPHeader CF-Connecting-IP
    # Cloudflare IPv4
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    # Cloudflare IPv6
    RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32 2405:8100::/32 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # mod_proxy_http appends the (now real, via mod_remoteip) client IP to
    # X-Forwarded-For automatically.

    ProxyPass        /  http://127.0.0.1:8080/
    ProxyPassReverse /  http://127.0.0.1:8080/

    ErrorLog  ${APACHE_LOG_DIR}/intro.loefbijter.nl-error.log
    CustomLog ${APACHE_LOG_DIR}/intro.loefbijter.nl-access.log combined
</VirtualHost>
